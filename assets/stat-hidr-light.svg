<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 108" width="270" height="108" role="img" aria-label="HI-DR 재현 후 후보 풀 확장 재설계, Jaccard 0.4550에서 0.5231 (동일 추천 크기, 5-seed)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#54aeff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="6" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0969da" fill-opacity=".14"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="140" y="0" width="130" height="108" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect x="1" y="1" width="268" height="106" rx="9"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="269" height="107" rx="9.5" fill="url(#bg)" stroke="#d0d7de"/>
  <g clip-path="url(#clip)">
    <rect x="140" y="0" width="130" height="108" fill="url(#dots)" mask="url(#m)"/>
    <rect x="0" y="0" width="5" height="108" fill="url(#bar)"/>
  </g>
  <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#0969da">RESEARCH</text>
  <text x="22" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.4" fill="#1f2328">0.455 → 0.523</text>
  <text x="22" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">HI-DR 재현 · 후보 풀 확장 재설계</text>
  <text x="22" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">Jaccard · 동일 추천 크기 · 5-seed</text>
</svg>
